[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-rate-limiter"
version = "0.1.0"
description = "Zero-dependency rate limiter for Python. Token bucket, leaky bucket, sliding window, fixed window. 5M ops/s."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" }]
keywords = ["rate-limit", "rate-limiter", "token-bucket", "leaky-bucket", "throttle", "throttling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-rate-limiter"
"Bug Tracker" = "https://github.com/hussain-alsaibai/tiny-rate-limiter/issues"

[tool.setuptools]
py-modules = ["rate_limiter"]